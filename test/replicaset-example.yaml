apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
      managed-by: replicaset
  template:
    metadata:
      labels:
        app: nginx
        managed-by: replicaset
    spec:
      containers:
      - name: nginx
        image: nginx:1.20
        ports:
        - containerPort: 80